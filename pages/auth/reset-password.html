<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12372a">
    <meta name="description" content="Set a new Shaikh China Sourcing ERP password">
    <title>Set new password | Shaikh China Sourcing ERP</title>
    <link rel="stylesheet" href="../../assets/css/tokens/design-tokens.css">
    <link rel="stylesheet" href="../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../assets/css/base/global.css">
    <link rel="stylesheet" href="../../assets/css/pages/auth.css">
  </head>
  <body class="auth-page" data-auth-page="reset-password">
    <main class="auth-layout auth-layout--compact">
      <section class="auth-form-panel">
        <div class="auth-card">
          <div class="auth-brand-lockup auth-brand-lockup--mobile">
            <span class="auth-brand-mark" aria-hidden="true">SCS</span>
            <span><strong>Shaikh China Sourcing</strong><small>Business ERP</small></span>
          </div>
          <div class="auth-card-heading">
            <p class="eyebrow">Secure recovery</p>
            <h1>Choose a new password</h1>
            <p>Use at least eight characters and avoid a password used elsewhere.</p>
          </div>
          <div class="auth-alert" data-reset-alert role="status" aria-live="polite" hidden></div>
          <form class="auth-form" data-reset-form novalidate>
            <div class="form-field">
              <label for="new-password">New password</label>
              <input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="8">
              <p class="field-error" data-error-for="new-password"></p>
            </div>
            <div class="form-field">
              <label for="confirm-password">Confirm new password</label>
              <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" required minlength="8">
              <p class="field-error" data-error-for="confirm-password"></p>
            </div>
            <button class="primary-button" type="submit" data-reset-submit>Update password</button>
          </form>
          <a class="auth-link" href="./">Return to sign in</a>
        </div>
      </section>
    </main>
    <script src="../../assets/vendor/supabase/supabase.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
  </body>
</html>
